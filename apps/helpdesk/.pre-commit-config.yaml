exclude: "node_modules|.git"
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        types_or: [python, pyi]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify==0.30.0
        args: ['--config', '.github/helpers/.flake8_strict']

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.6.2
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@2.6.2
        types: [file]
        types_or: [javascript, vue, html]

  - repo: local
    hooks:
      - id: theme-audit
        name: No hardcoded colors in desk/src
        entry: node desk/src/theme/build/audit-hardcoded.mjs
        language: system
        files: ^desk/src/
        pass_filenames: false
      - id: theme-tracked
        name: Palette files tracked and never ignored
        entry: node desk/src/theme/build/check-tracked.mjs
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/timothycrosley/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile, black]

ci:
  autoupdate_schedule: weekly
  skip: [theme-audit]
  submodules: false
