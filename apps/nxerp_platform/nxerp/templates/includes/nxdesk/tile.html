{#- One product tile (Home and Products). Reads `p` (nxerp.public_site.present). The markup follows the launcher tile. -#}
<a class="nxp-tile" href="{{ p.href | e }}" data-product="{{ p.key | e }}">
	<span class="nxp-mark">{% if p.logo %}<img src="{{ p.logo | e }}" alt="" />{% endif %}</span>
	<span class="nxp-tile-body">
		<span class="nxp-tile-title">{{ p.title | e }}</span>
		{% if p.tagline %}<span class="nxp-tile-tagline">{{ p.tagline | e }}</span>{% endif %}
		<span class="nxp-tile-cta">{{ p.cta | e }}</span>
	</span>
	<svg class="nxp-arrow" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
</a>
