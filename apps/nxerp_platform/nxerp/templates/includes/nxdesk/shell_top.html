{#- Theme toggle and language picker, top right of the panel. Same markup as the login page. -#}
<div class="nx-top">
	<button class="nx-theme-toggle" id="nx-theme-toggle" type="button" aria-label="{{ _('Toggle theme') }}" title="{{ _('Toggle theme') }}">
		<svg class="nx-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
		<svg class="nx-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
	</button>
	<label class="nx-lang">
		<svg class="nx-lang-globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.6-4-9s1.4-6.5 4-9Z"/></svg>
		<span class="nx-lang-label">{{ nx.lang_name | e }}</span>
		<select aria-label="{{ _('Language') }}">
			<option value="{{ nx.lang | e }}" selected>{{ nx.lang_name | e }}</option>
		</select>
		<svg class="nx-lang-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
	</label>
</div>
<div class="nx-product" aria-hidden="true">
	<span class="nx-mark">{% if product.logo %}<img src="{{ product.logo | e }}" alt="" />{% endif %}</span>
	<span>{{ product.title | e }}</span>
</div>
