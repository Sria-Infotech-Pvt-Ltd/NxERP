{#- <head> for the split-shell pages (signup, welcome). Reads `nx` and `title`. Same pre-paint theme script as head.html. -#}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>{{ title | e }}</title>
<link rel="icon" href="{{ nx.favicon | e }}" />
<script>
	(function () {
		try {
			var t = localStorage.getItem("theme");
			if (t !== "light" && t !== "dark" && t !== "system") t = "system";
			var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
			document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
		} catch (e) {
			document.documentElement.setAttribute("data-theme", "light");
		}
	})();
</script>
<link rel="stylesheet" href="/assets/nxerp/css/nxerp-theme.css?v={{ nx.css_theme }}" />
<link rel="stylesheet" href="/assets/nxerp/nxerp_login/css/nxerp-login.css?v={{ nx.css_login }}" />
<link rel="stylesheet" href="/assets/nxerp/css/nxerp-onboarding.css?v={{ nx.css_onboarding }}" />
