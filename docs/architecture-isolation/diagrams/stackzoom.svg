<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-label="Zoom: inside one app&#x27;s stack, the database and cache path (every app has exactly this)"><title>Zoom: inside one app&#x27;s stack, the database and cache path (every app has exactly this)</title><style>
:root{--svg-bx:#fffaf5;--svg-line:#8b6f5b;--svg-tx:#2a1d15;--svg-tx2:#6a5444;--svg-zone:#fbeadb;--svg-warnzone:#f6d5b8;--svg-db:#fdf1e4;--svg-warn:#fbdcd5;--svg-safe:#e6f0e0;--svg-note:#fff0d4;--svg-edge:#f1dfce;--svg-app:#fff4ea;--svg-stroke:#cfa98c;--accent:#b8531c;--unres:#b3261e;--panel:#fffaf5}
@media (prefers-color-scheme:dark){:root{--svg-bx:#2c221b;--svg-line:#b79b86;--svg-tx:#f4e8de;--svg-tx2:#c7b09e;--svg-zone:#2d2016;--svg-warnzone:#40281a;--svg-db:#33261b;--svg-warn:#43211d;--svg-safe:#1f3325;--svg-note:#3d311a;--svg-edge:#34271d;--svg-app:#322419;--svg-stroke:#6d5543;--accent:#e9915a;--unres:#ff8f85;--panel:#231b15}}
svg{background:var(--panel)}
.bx{fill:var(--svg-bx);stroke:var(--svg-stroke)}.bx-zone{fill:var(--svg-zone);stroke:var(--svg-stroke)}.bx-warnzone{fill:var(--svg-warnzone);stroke:var(--svg-stroke)}
.bx-db{fill:var(--svg-db);stroke:var(--accent)}.bx-warn{fill:var(--svg-warn);stroke:var(--unres)}.bx-safe{fill:var(--svg-safe);stroke:var(--svg-stroke)}
.bx-note{fill:var(--svg-note);stroke:var(--svg-stroke)}.bx-edge{fill:var(--svg-edge);stroke:var(--svg-stroke)}.bx-app{fill:var(--svg-app);stroke:var(--accent)}
.ln{stroke:var(--svg-line);stroke-width:1.5}.ln-bold{stroke:var(--svg-line);stroke-width:3.5}.ah{fill:var(--svg-line)}
.tx{fill:var(--svg-tx);font-family:system-ui,sans-serif}.tx2{fill:var(--svg-tx2);font-family:system-ui,sans-serif}.tb{font-weight:700}
.band{fill:var(--svg-edge);opacity:.4}.planned{stroke-dasharray:6 4}.num{fill:var(--accent);stroke:none}.numtx{fill:#fff;font-family:system-ui,sans-serif;font-weight:700}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect x="20" y="232" width="90" height="40" rx="6" class="bx"/><text x="65.0" y="254.5" text-anchor="middle" font-size="11" class="tx">Browser</text><rect x="140" y="232" width="100" height="40" rx="6" class="bx-edge"/><text x="190.0" y="254.5" text-anchor="middle" font-size="11" class="tx">Edge proxy</text><line x1="110" y1="252" x2="140" y2="252" class="ln" marker-end="url(#ah)"/><rect x="20" y="70" width="200" height="52" rx="6" class="bx-edge"/><text x="120.0" y="91.0" text-anchor="middle" font-size="11" class="tx">Identity site</text><text x="120.0" y="106.0" text-anchor="middle" font-size="11" class="tx">(access grants)</text><rect x="20" y="395" width="200" height="56" rx="6" class="bx planned"/><text x="120.0" y="418.0" text-anchor="middle" font-size="11" class="tx">Another app&#x27;s backend</text><text x="120.0" y="433.0" text-anchor="middle" font-size="11" class="tx">(a provider, with a contract)</text><rect x="270" y="14" width="600" height="508" rx="10" class="bx-zone"/><text x="570" y="34" text-anchor="middle" font-size="12" class="tx tb">ONE APP STACK: every app has exactly this (example: Helpdesk)</text><rect x="292" y="78" width="150" height="74" rx="6" class="bx-app"/><text x="367.0" y="102.5" text-anchor="middle" font-size="11" font-weight="700" class="tx">Web app (gunicorn)</text><text x="367.0" y="117.5" text-anchor="middle" font-size="11" class="tx">requests and the</text><text x="367.0" y="132.5" text-anchor="middle" font-size="11" class="tx">RBAC access gate</text><rect x="292" y="190" width="150" height="58" rx="6" class="bx-app"/><text x="367.0" y="214.0" text-anchor="middle" font-size="11" font-weight="700" class="tx">Websocket (socket.io)</text><text x="367.0" y="229.0" text-anchor="middle" font-size="11" class="tx">live updates</text><rect x="292" y="420" width="150" height="56" rx="6" class="bx-app"/><text x="367.0" y="443.0" text-anchor="middle" font-size="11" font-weight="700" class="tx">Scheduler</text><text x="367.0" y="458.0" text-anchor="middle" font-size="11" class="tx">timed jobs</text><rect x="490" y="56" width="188" height="238" rx="8" class="bx-edge"/><text x="584" y="74" text-anchor="middle" font-size="10" class="tx tb">CACHE AND QUEUE: this stack only</text><rect x="504" y="84" width="160" height="80" rx="6" class="bx"/><text x="584.0" y="105.0" text-anchor="middle" font-size="10" font-weight="700" class="tx">Redis cache</text><text x="584.0" y="119.0" text-anchor="middle" font-size="10" class="tx">Frappe cache and the</text><text x="584.0" y="133.0" text-anchor="middle" font-size="10" class="tx">5-minute customer-details</text><text x="584.0" y="147.0" text-anchor="middle" font-size="10" class="tx">cache. Memory only</text><rect x="504" y="180" width="160" height="100" rx="6" class="bx"/><text x="584.0" y="204.0" text-anchor="middle" font-size="10" font-weight="700" class="tx">Redis queue</text><text x="584.0" y="218.0" text-anchor="middle" font-size="10" class="tx">background jobs and</text><text x="584.0" y="232.0" text-anchor="middle" font-size="10" class="tx">live-update messages.</text><text x="584.0" y="246.0" text-anchor="middle" font-size="10" class="tx">Saved to disk</text><text x="584.0" y="260.0" text-anchor="middle" font-size="10" class="tx">(appendonly)</text><rect x="500" y="340" width="170" height="66" rx="6" class="bx-app"/><text x="585.0" y="360.5" text-anchor="middle" font-size="11" font-weight="700" class="tx">Background worker</text><text x="585.0" y="375.5" text-anchor="middle" font-size="11" class="tx">queues short, default,</text><text x="585.0" y="390.5" text-anchor="middle" font-size="11" class="tx">long</text><rect x="716" y="330" width="130" height="96" rx="6" class="bx"/><text x="781.0" y="352.0" text-anchor="middle" font-size="10" font-weight="700" class="tx">Files and secrets</text><text x="781.0" y="366.0" text-anchor="middle" font-size="10" class="tx">volume: uploads,</text><text x="781.0" y="380.0" text-anchor="middle" font-size="10" class="tx">search index,</text><text x="781.0" y="394.0" text-anchor="middle" font-size="10" class="tx">site_config,</text><text x="781.0" y="408.0" text-anchor="middle" font-size="10" class="tx">encryption_key</text><rect x="896" y="150" width="190" height="226" rx="8" class="bx-warnzone"/><text x="991" y="170" text-anchor="middle" font-size="10" class="tx tb">DATABASE SERVER</text><text x="991" y="183" text-anchor="middle" font-size="10" class="tx2">standard or restricted,</text><text x="991" y="195" text-anchor="middle" font-size="10" class="tx2">private network</text><rect x="910" y="212" width="162" height="100" rx="6" class="bx-db"/><text x="991.0" y="234.5" text-anchor="middle" font-size="11" font-weight="700" class="tx">This app&#x27;s database</text><text x="991.0" y="249.5" text-anchor="middle" font-size="11" class="tx">all of this app&#x27;s</text><text x="991.0" y="264.5" text-anchor="middle" font-size="11" class="tx">tables</text><text x="991.0" y="279.5" text-anchor="middle" font-size="11" class="tx">login: this database</text><text x="991.0" y="294.5" text-anchor="middle" font-size="11" class="tx">only</text><path d="M 240 252 H 262 V 112 H 292" fill="none" class="ln" marker-end="url(#ah)"/><path d="M 262 252 V 218 H 292" fill="none" class="ln" marker-end="url(#ah)"/><path d="M 220 96 H 250 V 100 H 292" fill="none" class="ln" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="255" y="66" text-anchor="middle" font-size="10" class="tx2">A: access grants (API)</text><path d="M 292 140 H 250 V 423 H 220" fill="none" class="ln" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="236" y="388" text-anchor="middle" font-size="10" class="tx2">B: read-only API</text><text x="236" y="401" text-anchor="middle" font-size="10" class="tx2">call (token)</text><path d="M 442 100 H 504" fill="none" class="ln" marker-end="url(#ah)"/><text x="473" y="94" text-anchor="middle" font-size="10" class="tx2">cache</text><path d="M 442 132 H 470 V 214 H 504" fill="none" class="ln" marker-end="url(#ah)"/><text x="455" y="150" text-anchor="middle" font-size="10" class="tx2">enqueue</text><path d="M 442 448 H 478 V 262 H 504" fill="none" class="ln" marker-end="url(#ah)"/><text x="459" y="352" text-anchor="middle" font-size="10" class="tx2">timed</text><text x="459" y="365" text-anchor="middle" font-size="10" class="tx2">jobs</text><path d="M 584 280 V 340" fill="none" class="ln" marker-end="url(#ah)"/><text x="612" y="316" text-anchor="middle" font-size="10" class="tx2">run job</text><line x1="442" y1="226" x2="504" y2="226" class="ln" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="458" y="244" text-anchor="middle" font-size="10" class="tx2">live</text><path d="M 670 372 H 716" fill="none" class="ln" marker-end="url(#ah)"/><path d="M 367 78 V 50 H 880 V 262 H 910" fill="none" class="ln-bold" marker-end="url(#ah)"/><text x="640" y="46" text-anchor="middle" font-size="10" class="tx tb">read and write, own login only</text><path d="M 670 396 H 700 V 436 H 880 V 296 H 910" fill="none" class="ln-bold" marker-end="url(#ah)"/><text x="790" y="452" text-anchor="middle" font-size="10" class="tx tb">read and write, own login only</text></svg>