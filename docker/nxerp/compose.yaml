# NXERP Help Desk (nxerp-stable) on Frappe v15.122.0. Test stack: separate project, own volumes, port 8001.
# The project name keeps it from touching the older frappe-help-desk-develop stack.
name: frappe-help-desk-nxerp-v15

x-backend: &backend
  image: ${IMAGE}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --password=$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis/redis-stack-server:7.2.0-v18
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *backend
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # One-shot: creates the site once, and skips if it already exists (never --force).
  create-site:
    <<: *backend
    restart: "no"
    entrypoint: ["bash", "-c"]
    environment:
      SITE_NAME: ${SITE_NAME}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command:
      - >
        if [ -d "sites/$${SITE_NAME}" ]; then echo "Site $${SITE_NAME} already exists, skipping";
        else bench new-site --mariadb-user-host-login-scope=% --db-root-username=root
        --db-root-password="$${DB_ROOT_PASSWORD}" --admin-password="$${ADMIN_PASSWORD}"
        --install-app telephony --install-app helpdesk --set-default "$${SITE_NAME}"; fi
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *backend
    # The realtime service authenticates by calling back to the Origin (http://<site>:8000), so the
    # site name must resolve to the backend on the compose network.
    networks:
      default:
        aliases:
          - ${SITE_NAME}
    # Server-side only: the frontend service never receives these keys.
    environment:
      HRMS_API_BASE_URL: ${HRMS_API_BASE_URL}
      HRMS_API_KEY: ${HRMS_API_KEY}
      PBT_API_BASE_URL: ${PBT_API_BASE_URL}
      PBT_API_KEY: ${PBT_API_KEY}
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *backend
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *backend
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *backend
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    # Realtime rejects a Host/Origin hostname mismatch ("Invalid origin"). nginx forces Origin to the
    # site name, so the template also sends the site name as Host on /socket.io, and Origin points at backend:8000 for the auth callback (see the template).
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./nginx.frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    ports:
      - "8001:8080"
    depends_on:
      - backend
      - websocket

volumes:
  db-data:
  sites:
  logs:
  redis-queue-data:
  redis-cache-data:
