[tool.ruff]
# Paths to lint
src = ["apps/helpdesk/helpdesk", "apps/nxerp/nxerp"]

# Match the existing .flake8 settings in helpdesk
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Enable a sensible baseline set
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]

ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (Frappe pattern)
    "SIM108", # ternary operator — often less readable in Frappe context
]

# Per-file overrides
[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]   # assert is fine in tests
"*/patches/*" = ["UP"]   # avoid auto-upgrade in migration scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
