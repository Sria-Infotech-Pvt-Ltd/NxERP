name: CI

# STATUS: this workflow has NOT been run on GitHub yet (authored from a local checkout; the account used
# has no write access to the repository). The test, lint, bandit and pin-check commands were each run
# locally against the dev stack (see docs/security/phase2-review.md); the GitHub-specific parts (the
# runner, the readiness loop, the artifact upload) have not been exercised.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  pins:
    name: Validate version pins and architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I deploy/check_pins.py
      - run: python3 -I tools/check_architecture.py
      - run: pip install bandit && bandit -r nxerp -x nxerp/tests -q && bandit -r nxerp/tests -s B101,B105,B106,B311 -q

  install-smoke:
    name: Install smoke (frappe + erpnext + helpdesk + nxerp)
    runs-on: ubuntu-latest
    needs: [lint, pins]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the dev platform
        run: ./deploy/dev/up.sh -d
      - name: Wait for bootstrap
        run: |
          for i in $(seq 1 240); do
            if docker compose -p nxerp-dev logs bench 2>&1 | grep -q '\[bootstrap\] ready:'; then
              echo "bootstrap finished"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' nxerp-dev-bench-1)" != "true" ]; then
              echo "bench container stopped before it was ready"; docker compose -p nxerp-dev logs --tail 200 bench; exit 1
            fi
            sleep 15
          done
          echo "timed out waiting for bootstrap"; docker compose -p nxerp-dev logs --tail 200 bench; exit 1
      - name: Installed apps
        run: docker compose -p nxerp-dev exec -T bench bash -lc 'cd frappe-bench && bench --site nxerp.localhost list-apps'
      - name: Site answers
        run: |
          curl -fsS http://localhost:8100/api/method/ping
          curl -fsS -o /dev/null -w 'login: %{http_code}\n' http://localhost:8100/login
          curl -fsS -o /dev/null -w 'helpdesk: %{http_code}\n' http://localhost:8100/helpdesk
      - name: Let tests create many throwaway users
        # Frappe refuses more than `throttle_user_limit` (default 60) new users per hour; the access
        # tests and Helpdesk's own suite create more. Stored as a number (-p), not a string.
        run: docker compose -p nxerp-dev exec -T bench bash -lc 'cd frappe-bench && bench --site nxerp.localhost set-config -p throttle_user_limit 100000 && bench --site nxerp.localhost set-config allow_tests true'
      - name: nxerp access-layer tests (registry, resolver, guard, enforcement, persona x surface matrix, customer leaks, ERPNext smoke)
        run: |
          docker compose -p nxerp-dev exec -T -e NXERP_MATRIX_OUT=/workspace/docs/security/phase2-matrix.md bench             bash -lc 'cd frappe-bench && bench --site nxerp.localhost run-tests --app nxerp'
      - name: Upload the persona x surface matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-matrix
          path: docs/security/phase2-matrix.md
          if-no-files-found: warn
      - name: Helpdesk regression (its own suite, with the access layer active)
        run: docker compose -p nxerp-dev exec -T bench bash -lc 'cd frappe-bench && bench --site nxerp.localhost run-tests --app helpdesk'
      - name: Logs on failure
        if: failure()
        run: docker compose -p nxerp-dev logs --tail 300 bench
