name: stack-up
description: >
  Bring up the NXERP dev stack (deploy/dev) for a test job: fetch Helpdesk at its pinned commit, restore the cached stack
  volumes when a cache exists (otherwise bootstrap from empty volumes), start it, wait until ready, migrate the cached site
  to this checkout, and let the tests create users. A stack cannot be shared between GitHub jobs; the cache is what is shared.
inputs:
  token:
    description: Read token for the Helpdesk repository (secrets.HELPDESK_READ_TOKEN)
    default: ""
  use-cache:
    description: '"true" restores the stack-volume cache keyed on the pins; "false" always bootstraps from empty volumes'
    default: "true"
  with-e2e-site:
    description: '"true" also migrates the cached fresh e2e site (nxerp-e2e.localhost) and re-snapshots it'
    default: "false"
outputs:
  cache-hit:
    description: '"true" when the stack volumes came from the cache'
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/helpdesk-fetch
      with:
        dest: ${{ github.workspace }}/../helpdesk
        token: ${{ inputs.token }}

    - name: Restore the stack-volume cache
      id: cache
      if: inputs.use-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/stack-volumes
        key: stack-${{ runner.os }}-${{ hashFiles('deploy/apps.json', 'deploy/versions.env', 'deploy/dev/bootstrap.sh', 'deploy/dev/compose.yaml', 'e2e/site.sh') }}

    - name: Load the cached volumes into Docker
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: scripts/ci_stack.sh volumes restore "$RUNNER_TEMP/stack-volumes"

    - name: Start the stack and wait for it
      shell: bash
      run: scripts/ci_stack.sh up

    - name: Apply this checkout's migrations to the cached site
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        WITH_E2E: ${{ inputs.with-e2e-site }}
      run: |
        set -euo pipefail
        # the cache was built from an earlier commit: new patches and schema changes of THIS checkout apply here
        scripts/ci_stack.sh bench migrate
        if [ "$WITH_E2E" = true ]; then
          scripts/ci_stack.sh sh 'bench --site nxerp-e2e.localhost migrate'
          ./e2e/site.sh snapshot   # the site is still pristine (no wizard run): re-save it at this schema
        fi

    - name: Allow tests and lift the new-user throttle
      shell: bash
      run: scripts/ci_stack.sh prep
